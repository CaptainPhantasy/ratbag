<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ratbag">
  <!-- Transparent background — no rect -->
  <!-- Hard hat -->
  <path fill="#E8E0D0" d="M14 22c1-8 10-14 18-14s17 6 18 14c0 2-2 3-4 3H18c-2 0-4-1-4-3z"/>
  <path fill="#C9BFA8" d="M16 24h32c.5 2-1 3.5-3 3.5H19c-2 0-3.5-1.5-3-3.5z"/>
  <ellipse cx="32" cy="12" rx="5" ry="2.2" fill="#D6CDB8"/>
  <!-- Weathering scuffs -->
  <path fill="#B8AD95" opacity=".55" d="M22 18l3 1-1 2-3-1zM40 17l2 2-2 1-1-2z"/>
  <!-- Head fur -->
  <ellipse cx="32" cy="36" rx="16" ry="15" fill="#6B6E73"/>
  <ellipse cx="32" cy="37" rx="13" ry="12" fill="#7A7E84"/>
  <!-- Notched left ear (viewer left) -->
  <path fill="#6B6E73" d="M14 28c-4-2-6 2-5 6 1 3 4 5 7 4 .5-2 1-5 0-7-2-1-2-2-2-3z"/>
  <path fill="#C48B8B" d="M15 30c-2 0-3 2-2.5 4 .4 1.5 2 2.5 3.5 2 .3-1.5.5-3.5-.2-5-.4-.5-.6-1-.8-1z"/>
  <!-- Notch cut -->
  <path fill="#5A5D62" d="M12 26l3 2-1.5 2.5-3-1.5z"/>
  <!-- Right ear -->
  <path fill="#6B6E73" d="M50 28c4-2 6 2 5 6-1 3-4 5-7 4-.5-2-1-5 0-7 2-1 2-2 2-3z"/>
  <path fill="#C48B8B" d="M49 30c2 0 3 2 2.5 4-.4 1.5-2 2.5-3.5 2-.3-1.5-.5-3.5.2-5 .4-.5.6-1 .8-1z"/>
  <!-- Furrowed brow -->
  <path stroke="#3F4246" stroke-width="2.2" stroke-linecap="round" fill="none" d="M22 32c3-2 7-3 10-2M32 30c3-1 7 0 10 2"/>
  <path stroke="#2E3135" stroke-width="1.6" stroke-linecap="round" fill="none" d="M24 33.5c2.5-1.2 5.5-1.8 8-1.2M32 32.2c2.5-.4 5.2.2 7.8 1.4"/>
  <!-- Eyes -->
  <ellipse cx="26" cy="37" rx="3.2" ry="3.6" fill="#F2E9C9"/>
  <ellipse cx="38" cy="37" rx="3.2" ry="3.6" fill="#F2E9C9"/>
  <circle cx="26.4" cy="37.4" r="1.55" fill="#1A1C1E"/>
  <circle cx="38.4" cy="37.4" r="1.55" fill="#1A1C1E"/>
  <circle cx="25.7" cy="36.6" r=".45" fill="#FFF"/>
  <circle cx="37.7" cy="36.6" r=".45" fill="#FFF"/>
  <!-- Snout -->
  <ellipse cx="32" cy="43" rx="5.5" ry="4.2" fill="#8A7F78"/>
  <ellipse cx="32" cy="42.2" rx="3.8" ry="2.8" fill="#A09088"/>
  <!-- Nose -->
  <ellipse cx="32" cy="41" rx="2.1" ry="1.5" fill="#C47A8A"/>
  <ellipse cx="31.4" cy="40.5" rx=".6" ry=".4" fill="#E0A0AC" opacity=".7"/>
  <!-- Buck tooth -->
  <rect x="30.2" y="45.2" width="3.6" height="4.2" rx=".7" fill="#F7F3E8"/>
  <path stroke="#D9D2C0" stroke-width=".5" d="M32 45.4v3.8"/>
  <!-- Whiskers -->
  <path stroke="#2A2C2E" stroke-width=".7" stroke-linecap="round" fill="none" d="M18 40c-4 0-7 1-9 2M18 43c-4 .5-7 2-8.5 3.5M46 40c4 0 7 1 9 2M46 43c4 .5 7 2 8.5 3.5"/>
  <!-- Safety-orange collar / waist-pack badge -->
  <path fill="#FF6A1A" d="M18 50c2-3 8-5 14-5s12 2 14 5c1 2 0 5-2 6H20c-2-1-3-4-2-6z"/>
  <path fill="#E85A10" d="M20 54h24c1 0 1.5 1 1 2H19c-.5-1 0-2 1-2z"/>
  <text x="32" y="55.2" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="5.2" font-weight="800" letter-spacing=".4" fill="#141414">RATBAG</text>
</svg>

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ratbag"
version = "0.2.0"
description = "Local, patch-only coding workbench with plan, test and review evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "RATBAG contributors"}]
keywords = ["coding-agent", "code-review", "local-first", "git", "patch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
ratbag = "swarm.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm*"]
